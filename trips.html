<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trips — @craftzdog</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.28);
    --glass-border: rgba(255, 255, 255, 0.45);
    --text-dark: #1a1a1a;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 20px 14px calc(60px + env(safe-area-inset-bottom));
    background-color: #2b3a2b;
    background-image: url('assets/background.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    overscroll-behavior-y: none;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
  }

  /* ==== Sticky back bar — dễ bấm bằng ngón cái ==== */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    padding: 8px 0 16px;
    margin: -20px -14px 8px;
    padding-left: 14px;
    padding-top: calc(12px + env(safe-area-inset-top));
    background: linear-gradient(to bottom, rgba(0,0,0,0.35), transparent);
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 15px;
    background: rgba(0,0,0,0.5);
    padding: 10px 16px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    min-height: 44px; /* touch target chuẩn */
  }
  .back:active { background: rgba(0,0,0,0.7); }

  .header { text-align: center; margin-bottom: 20px; }
  .header h1 {
    color: #fff;
    font-size: 26px;
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .header p {
    color: rgba(255,255,255,0.85);
    margin: 0;
    font-size: 14px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  /* ==== Trip grid: 2 cột trên điện thoại, thoáng và dễ bấm ==== */
  .trip-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }

  @media (min-width: 560px) {
    .trip-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
  }

  .trip-card {
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    aspect-ratio: 3 / 4;
    touch-action: manipulation;
  }

  .trip-card .cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .trip-card:active .cover { transform: scale(0.97); }
  .trip-card .cover { transition: transform 0.15s ease; }

  .trip-card .stack-hint {
    position: absolute;
    top: 8px;
    right: 8px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  .trip-card .info {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
    color: #fff;
  }
  .trip-card .info .title { font-size: 14px; font-weight: 700; line-height: 1.2; }
  .trip-card .info .subtitle { font-size: 10.5px; opacity: 0.85; margin-top: 2px; }

  /* ==== Nút "Xem thêm" thay cho số trang — dễ bấm hơn nhiều trên di động ==== */
  .load-more {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 15px;
    border: none;
    border-radius: 999px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    color: #fff;
    font-weight: 700;
    font-size: 15px;
    cursor: pointer;
    min-height: 48px;
  }
  .load-more:active { background: rgba(255,255,255,0.3); }

  .empty-state {
    grid-column: 1 / -1;
    color: rgba(255,255,255,0.9);
    text-align: center;
    padding: 50px 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    font-size: 14.5px;
    line-height: 1.6;
  }

  /* ==== Album viewer: full màn hình, vuốt để chuyển ảnh ==== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: #000;
    z-index: 100;
    flex-direction: column;
    touch-action: pan-y;
  }
  .lightbox.open { display: flex; }

  .lb-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: calc(14px + env(safe-area-inset-top)) 16px 12px;
    color: #fff;
    z-index: 3;
  }
  .lb-title { font-size: 15px; font-weight: 700; }
  .lb-counter { font-size: 12.5px; opacity: 0.7; margin-top: 1px; }

  .lb-close {
    color: #fff;
    font-size: 26px;
    background: rgba(255,255,255,0.12);
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    cursor: pointer;
    line-height: 1;
    flex-shrink: 0;
  }

  .lb-stage {
    position: relative;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .lb-track {
    display: flex;
    height: 100%;
    width: 100%;
    transition: transform 0.3s ease;
    will-change: transform;
  }

  .lb-slide {
    min-width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px;
  }

  .lb-slide img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 6px;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
  }

  /* Vùng chạm 2 bên để chuyển ảnh — thay thế nút mũi tên nhỏ */
  .tap-zone {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 30%;
    z-index: 2;
  }
  .tap-zone.left { left: 0; }
  .tap-zone.right { right: 0; }

  .lb-caption {
    padding: 10px 20px calc(10px + env(safe-area-inset-bottom));
    color: #fff;
    font-size: 13.5px;
    text-align: center;
    opacity: 0.9;
    min-height: 20px;
  }

  .lb-dots {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding-bottom: 10px;
  }
  .lb-dots .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    transition: background 0.2s ease, transform 0.2s ease;
  }
  .lb-dots .dot.active {
    background: #fff;
    transform: scale(1.3);
  }
</style>
</head>
<body>

  <div class="wrap">
    <div class="topbar">
      <a class="back" href="index.html">&larr; Về trang chính</a>
    </div>

    <div class="header">
      <h1>Những chuyến đi của tôi</h1>
      <p>Chạm vào để xem hết ảnh</p>
    </div>

    <div class="trip-grid" id="tripGrid"></div>
    <button class="load-more" id="loadMoreBtn" style="display:none;">Xem thêm chuyến đi</button>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lb-topbar">
      <div>
        <div class="lb-title" id="lbTitle"></div>
        <div class="lb-counter" id="lbCounter"></div>
      </div>
      <button class="lb-close" id="lbClose">&times;</button>
    </div>

    <div class="lb-stage" id="lbStage">
      <div class="tap-zone left" id="tapLeft"></div>
      <div class="tap-zone right" id="tapRight"></div>
      <div class="lb-track" id="lbTrack"></div>
    </div>

    <div class="lb-caption" id="lbCaption"></div>
    <div class="lb-dots" id="lbDots"></div>
  </div>

  <script>
    /* ============================================================
       GOM ẢNH THEO TỪNG CHUYẾN ĐI Ở ĐÂY
       - Mỗi chuyến là 1 object trong mảng "trips"
       - "cover"  = ảnh đại diện hiện ở ngoài lưới
       - "photos" = TẤT CẢ ảnh của chuyến đó
       - Gợi ý: tạo 1 thư mục con riêng cho mỗi chuyến:
           assets/trips/dalat/1.jpg, 2.jpg ...
    ============================================================ */
    const trips = [
      {
        title:"Photo",
        cover:"assets/trips/dalat/IMG_2675.jpg",
        photos: [
            {src:"assets/trips/dalat/IMG_2811.JPG", caption:""},
            {src:"assets/trips/dalat/IMG_2817.JPG", caption:""},
            {src:"assets/trips/dalat/IMG_2821.JPG", caption:""},
            {src:"assets/trips/dalat/IMG_2873.JPG", caption:""},
            {src:"assets/trips/dalat/IMG_2868.JPG", caption:""},

        ]
      },
    ];

    const tripGrid = document.getElementById('tripGrid');
    const loadMoreBtn = document.getElementById('loadMoreBtn');
    const lightbox = document.getElementById('lightbox');
    const lbTitle = document.getElementById('lbTitle');
    const lbCounter = document.getElementById('lbCounter');
    const lbTrack = document.getElementById('lbTrack');
    const lbCaption = document.getElementById('lbCaption');
    const lbDots = document.getElementById('lbDots');
    const tapLeft = document.getElementById('tapLeft');
    const tapRight = document.getElementById('tapRight');
    const lbStage = document.getElementById('lbStage');

    const ALBUMS_PER_LOAD = 6; // mỗi lần "Xem thêm" sẽ hiện thêm 6 album
    let visibleCount = ALBUMS_PER_LOAD;
    let currentTrip = null;
    let currentIndex = 0;

    function renderGrid() {
      if (trips.length === 0) {
        tripGrid.innerHTML = `
          <div class="empty-state">
            Chưa có chuyến đi nào.<br>
            Thêm ảnh vào <b>assets/trips/ten-chuyen-di/</b> rồi khai báo
            trong mảng <code>trips</code> ở file này.
          </div>`;
        loadMoreBtn.style.display = 'none';
        return;
      }

      const visibleTrips = trips.slice(0, visibleCount);
      tripGrid.innerHTML = '';
      visibleTrips.forEach((trip) => {
        const realIndex = trips.indexOf(trip);
        const card = document.createElement('div');
        card.className = 'trip-card';
        card.innerHTML = `
          <img class="cover" src="${trip.cover}" alt="${trip.title}" loading="lazy">
          <span class="stack-hint">${trip.photos.length} ảnh</span>
          <div class="info">
            <div class="title">${trip.title}</div>
            <div class="subtitle">${trip.subtitle || ''}</div>
          </div>
        `;
        card.addEventListener('click', () => openAlbum(realIndex, 0));
        tripGrid.appendChild(card);
      });

      loadMoreBtn.style.display = visibleCount < trips.length ? 'block' : 'none';
    }

    loadMoreBtn.addEventListener('click', () => {
      visibleCount += ALBUMS_PER_LOAD;
      renderGrid();
    });

    function openAlbum(tripIndex, photoIndex) {
      currentTrip = trips[tripIndex];
      currentIndex = photoIndex;
      lbTitle.textContent = currentTrip.title;

      lbTrack.innerHTML = currentTrip.photos.map(p => `
        <div class="lb-slide"><img src="${p.src}" alt=""></div>
      `).join('');

      lbDots.innerHTML = currentTrip.photos.map((_, i) =>
        `<span class="dot${i === 0 ? ' active' : ''}"></span>`
      ).join('');

      updateSlidePosition(false);
      showCaption();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    function updateSlidePosition(animate = true) {
      lbTrack.style.transition = animate ? 'transform 0.3s ease' : 'none';
      lbTrack.style.transform = `translateX(-${currentIndex * 100}%)`;
      lbCounter.textContent = `${currentIndex + 1} / ${currentTrip.photos.length}`;
      [...lbDots.children].forEach((el, i) => el.classList.toggle('active', i === currentIndex));
    }

    function showCaption() {
      const photo = currentTrip.photos[currentIndex];
      lbCaption.textContent = photo.caption || '';
    }

    function goTo(index) {
      if (index < 0 || index > currentTrip.photos.length - 1) return;
      currentIndex = index;
      updateSlidePosition(true);
      showCaption();
    }

    function closeLightbox() {
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    document.getElementById('lbClose').addEventListener('click', closeLightbox);
    tapLeft.addEventListener('click', () => goTo(currentIndex - 1));
    tapRight.addEventListener('click', () => goTo(currentIndex + 1));

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') goTo(currentIndex - 1);
      if (e.key === 'ArrowRight') goTo(currentIndex + 1);
    });

    /* ==== Vuốt ngang để chuyển ảnh (swipe) ==== */
    let touchStartX = 0;
    let touchStartY = 0;
    let dragging = false;

    lbStage.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      dragging = true;
      lbTrack.style.transition = 'none';
    }, { passive: true });

    lbStage.addEventListener('touchmove', (e) => {
      if (!dragging) return;
      const dx = e.touches[0].clientX - touchStartX;
      const percent = (dx / lbStage.clientWidth) * 100;
      lbTrack.style.transform = `translateX(calc(-${currentIndex * 100}% + ${percent}%))`;
    }, { passive: true });

    lbStage.addEventListener('touchend', (e) => {
      if (!dragging) return;
      dragging = false;
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) goTo(currentIndex + 1);
        else goTo(currentIndex - 1);
      } else {
        updateSlidePosition(true);
      }
    });

    renderGrid();
  </script>

</body>
</html>
