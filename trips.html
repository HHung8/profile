<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trips — @craftzdog</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.28);
    --glass-border: rgba(255, 255, 255, 0.45);
    --text-dark: #1a1a1a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-color: #2b3a2b;
    background-image: url('assets/background.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .wrap {
    max-width: 960px;
    margin: 0 auto;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    background: rgba(0,0,0,0.45);
    padding: 8px 14px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    margin-bottom: 24px;
  }
  .back:hover { background: rgba(0,0,0,0.6); }

  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    color: #fff;
    font-size: 30px;
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .header p {
    color: rgba(255,255,255,0.85);
    margin: 0;
    font-size: 15px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  /* ==== Trip album cards ==== */
  .trip-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 20px;
  }

  .trip-card {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 18px rgba(0,0,0,0.18);
    cursor: pointer;
    aspect-ratio: 4 / 5;
  }

  .trip-card .cover {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .trip-card:hover .cover { transform: scale(1.05); }

  .trip-card .stack-hint {
    position: absolute;
    top: 10px;
    right: 10px;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    padding: 4px 9px;
    border-radius: 999px;
    backdrop-filter: blur(4px);
  }

  .trip-card .info {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 14px;
    background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
    color: #fff;
  }
  .trip-card .info .title { font-size: 16px; font-weight: 700; }
  .trip-card .info .subtitle { font-size: 12.5px; opacity: 0.85; margin-top: 2px; }

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin-top: 32px;
  }

  .page-btn {
    min-width: 38px;
    height: 38px;
    padding: 0 10px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(8px);
    color: #fff;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  .page-btn:hover { background: rgba(255,255,255,0.42); }

  .page-btn.active {
    background: #fff;
    color: #1a1a1a;
  }

  .page-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .empty-state {
    color: rgba(255,255,255,0.9);
    text-align: center;
    padding: 60px 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    font-size: 15px;
    line-height: 1.6;
  }

  /* ==== Album viewer (lightbox with multiple photos) ==== */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 100;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .lightbox.open { display: flex; }

  .lightbox-topbar {
    position: absolute;
    top: 20px;
    left: 24px;
    right: 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
  }

  .lightbox-close {
    color: #fff;
    font-size: 28px;
    background: none;
    border: none;
    cursor: pointer;
    line-height: 1;
  }

  .lightbox-stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    max-width: 900px;
  }

  .lightbox-stage img {
    max-width: 100%;
    max-height: 78vh;
    border-radius: 10px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  .nav-btn {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #fff;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    margin: 0 14px;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.28); }
  .nav-btn:disabled { opacity: 0.25; cursor: default; }

  .lightbox-caption {
    margin-top: 16px;
    color: #fff;
    font-size: 14px;
    text-align: center;
    opacity: 0.9;
  }

  .thumbs {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    max-width: 90vw;
    overflow-x: auto;
    padding-bottom: 4px;
  }
  .thumbs img {
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 8px;
    opacity: 0.5;
    cursor: pointer;
    border: 2px solid transparent;
    flex-shrink: 0;
  }
  .thumbs img.active {
    opacity: 1;
    border-color: #fff;
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="back" href="index.html">&larr; Về trang chính</a>

    <div class="header">
      <h1>Những chuyến đi của tôi</h1>
      <p>Mỗi thẻ là một chuyến — bấm vào để xem hết ảnh</p>
    </div>

    <div class="trip-grid" id="tripGrid"></div>
    <div class="pagination" id="pagination"></div>
  </div>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-topbar">
      <span id="lbTitle"></span>
      <button class="lightbox-close" id="lbClose">&times;</button>
    </div>

    <div class="lightbox-stage">
      <button class="nav-btn" id="lbPrev">&#8249;</button>
      <img id="lbImg" src="" alt="">
      <button class="nav-btn" id="lbNext">&#8250;</button>
    </div>

    <div class="lightbox-caption" id="lbCaption"></div>
    <div class="thumbs" id="lbThumbs"></div>
  </div>

  <script>
    /* ============================================================
       GOM ẢNH THEO TỪNG CHUYẾN ĐI Ở ĐÂY
       - Mỗi chuyến là 1 object trong mảng "trips"
       - "cover"  = ảnh đại diện hiện ở ngoài lưới (thường là ảnh đẹp nhất)
       - "photos" = TẤT CẢ ảnh của chuyến đó (bao nhiêu ảnh cũng được)
       - Gợi ý: tạo 1 thư mục con riêng cho mỗi chuyến, ví dụ:
           assets/trips/dalat/1.jpg, 2.jpg, 3.jpg ...
           assets/trips/hoian/1.jpg, 2.jpg ...
         để dễ quản lý, khỏi lẫn ảnh giữa các chuyến.
    ============================================================ */
    const trips = [
      {
        title:"Đà Lạt",
        subtitle:"2026",
        cover:"assets/trips/dalat/IMG_2675.jpg",
        photos: [
            {src:"assets/trips/dalat/IMG_2811.JPG", caption:"Hồ Xuân Hương"},
            {src:"assets/trips/dalat/IMG_2817.JPG", caption:"Đồi Chè Cầu Đất"},
            {src:"assets/trips/dalat/IMG_2821.JPG", caption:""},
        ]
      },
      {
        title:"Nha Trang",
        subtitle:"2026",
        cover:"assets/trips/nhatrang/IMG_1167.JPG",
        photos: [
            {src:"assets/trips/nhatrang/IMG_1199.JPG", caption:""},
            {src:"assets/trips/nhatrang/IMG_1270.JPG", caption:""},
            {src:"assets/trips/nhatrang/IMG_1437.JPG", caption:""},
        ]
      },
      
    ];

    const tripGrid = document.getElementById('tripGrid');
    const pagination = document.getElementById('pagination');
    const lightbox = document.getElementById('lightbox');
    const lbTitle = document.getElementById('lbTitle');
    const lbImg = document.getElementById('lbImg');
    const lbCaption = document.getElementById('lbCaption');
    const lbThumbs = document.getElementById('lbThumbs');
    const lbPrev = document.getElementById('lbPrev');
    const lbNext = document.getElementById('lbNext');

    const ALBUMS_PER_PAGE = 6; // đổi số này nếu muốn khác 6 album/trang
    let currentPage = 1;
    let currentTrip = null;
    let currentIndex = 0;

    function renderGrid() {
      if (trips.length === 0) {
        tripGrid.innerHTML = `
          <div class="empty-state" style="grid-column: 1 / -1;">
            Chưa có chuyến đi nào.<br>
            Thêm ảnh vào <b>assets/trips/ten-chuyen-di/</b> rồi khai báo
            trong mảng <code>trips</code> ở file này.
          </div>`;
        pagination.innerHTML = '';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(trips.length / ALBUMS_PER_PAGE));
      if (currentPage > totalPages) currentPage = totalPages;

      const start = (currentPage - 1) * ALBUMS_PER_PAGE;
      const pageTrips = trips.slice(start, start + ALBUMS_PER_PAGE);

      tripGrid.innerHTML = '';
      pageTrips.forEach((trip) => {
        const realIndex = trips.indexOf(trip);
        const card = document.createElement('div');
        card.className = 'trip-card';
        card.innerHTML = `
          <img class="cover" src="${trip.cover}" alt="${trip.title}" loading="lazy">
          <span class="stack-hint">${trip.photos.length} ảnh</span>
          <div class="info">
            <div class="title">${trip.title}</div>
            <div class="subtitle">${trip.subtitle || ''}</div>
          </div>
        `;
        card.addEventListener('click', () => openAlbum(realIndex, 0));
        tripGrid.appendChild(card);
      });

      renderPagination(totalPages);
    }

    function renderPagination(totalPages) {
      pagination.innerHTML = '';
      if (totalPages <= 1) return;

      const prevBtn = document.createElement('button');
      prevBtn.className = 'page-btn';
      prevBtn.textContent = '‹';
      prevBtn.disabled = currentPage === 1;
      prevBtn.addEventListener('click', () => { currentPage--; renderGrid(); window.scrollTo({top:0, behavior:'smooth'}); });
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.className = 'page-btn' + (i === currentPage ? ' active' : '');
        btn.textContent = i;
        btn.addEventListener('click', () => { currentPage = i; renderGrid(); window.scrollTo({top:0, behavior:'smooth'}); });
        pagination.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.className = 'page-btn';
      nextBtn.textContent = '›';
      nextBtn.disabled = currentPage === totalPages;
      nextBtn.addEventListener('click', () => { currentPage++; renderGrid(); window.scrollTo({top:0, behavior:'smooth'}); });
      pagination.appendChild(nextBtn);
    }

    function openAlbum(tripIndex, photoIndex) {
      currentTrip = trips[tripIndex];
      currentIndex = photoIndex;
      lbTitle.textContent = currentTrip.title;
      renderThumbs();
      showPhoto();
      lightbox.classList.add('open');
    }

    function showPhoto() {
      const photo = currentTrip.photos[currentIndex];
      lbImg.src = photo.src;
      lbCaption.textContent = photo.caption || '';
      lbPrev.disabled = currentIndex === 0;
      lbNext.disabled = currentIndex === currentTrip.photos.length - 1;
      [...lbThumbs.children].forEach((el, i) => {
        el.classList.toggle('active', i === currentIndex);
      });
    }

    function renderThumbs() {
      lbThumbs.innerHTML = '';
      currentTrip.photos.forEach((p, i) => {
        const img = document.createElement('img');
        img.src = p.src;
        img.addEventListener('click', () => { currentIndex = i; showPhoto(); });
        lbThumbs.appendChild(img);
      });
    }

    lbPrev.addEventListener('click', () => {
      if (currentIndex > 0) { currentIndex--; showPhoto(); }
    });
    lbNext.addEventListener('click', () => {
      if (currentIndex < currentTrip.photos.length - 1) { currentIndex++; showPhoto(); }
    });
    document.getElementById('lbClose').addEventListener('click', () => {
      lightbox.classList.remove('open');
    });
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.classList.remove('open');
    });
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape') lightbox.classList.remove('open');
      if (e.key === 'ArrowLeft' && !lbPrev.disabled) { currentIndex--; showPhoto(); }
      if (e.key === 'ArrowRight' && !lbNext.disabled) { currentIndex++; showPhoto(); }
    });

    renderGrid();
  </script>

</body>
</html>
