<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@with_nhhung</title>
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.28);
            --glass-border: rgba(255, 255, 255, 0.45);
            --text-dark: #1a1a1a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 60px 20px;

            /* === THAY ẢNH NỀN CỦA BẠN Ở ĐÂY ===
       Cách 1: đặt file "background.jpg" cùng thư mục với index.html rồi để nguyên dòng dưới.
       Cách 2: dùng ảnh online: background-image: url('https://.../ten-anh.jpg'); */
            background-image: url('./assets/home/IMG_2848.JPG');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #2b3a2b;
            /* màu dự phòng nếu chưa có ảnh */
        }

        .card {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid rgba(255, 255, 255, 0.9);
            object-fit: cover;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
            background: #444;
        }

        .username {
            margin-top: 14px;
            margin-bottom: 28px;
            padding: 6px 16px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            letter-spacing: 0.2px;
            backdrop-filter: blur(4px);
        }

        .links {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 18px 24px;
            border-radius: 999px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(14px) saturate(140%);
            -webkit-backdrop-filter: blur(14px) saturate(140%);
            color: var(--text-dark);
            text-decoration: none;
            font-size: 17px;
            font-weight: 600;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.12);
            transition: transform 0.15s ease, background 0.15s ease;
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.42);
            transform: translateY(-2px);
        }

        .link-btn:active {
            transform: translateY(0px) scale(0.98);
        }

        .icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: inline-flex;
        }

        .icon svg {
            width: 100%;
            height: 100%;
        }

        @media (max-width: 480px) {
            .link-btn {
                font-size: 15px;
                padding: 16px 18px;
            }

            .avatar {
                width: 84px;
                height: 84px;
            }
        }
    </style>
</head>
