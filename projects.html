<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — @craftzdog</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.28);
    --glass-border: rgba(255, 255, 255, 0.45);
    --text-dark: #1a1a1a;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    padding: 40px 20px 80px;
    background-color: #2b3a2b;
    background-image: url('assets/background.jpg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
  }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
  }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    background: rgba(0,0,0,0.45);
    padding: 8px 14px;
    border-radius: 999px;
    backdrop-filter: blur(6px);
    margin-bottom: 24px;
  }
  .back:hover { background: rgba(0,0,0,0.6); }

  .header { text-align: center; margin-bottom: 32px; }
  .header h1 {
    color: #fff;
    font-size: 30px;
    margin: 0 0 6px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.4);
  }
  .header p {
    color: rgba(255,255,255,0.85);
    margin: 0;
    font-size: 15px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.4);
  }

  .project-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .project-card {
    display: flex;
    gap: 16px;
    align-items: center;
    padding: 18px 20px;
    border-radius: 18px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    backdrop-filter: blur(12px) saturate(140%);
    box-shadow: 0 4px 18px rgba(0,0,0,0.15);
    text-decoration: none;
    color: var(--text-dark);
    transition: transform 0.15s ease, background 0.15s ease;
  }

  .project-card:hover {
    background: rgba(255,255,255,0.42);
    transform: translateY(-2px);
  }

  .project-thumb {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    flex-shrink: 0;
    object-fit: cover;
    background: rgba(0,0,0,0.15);
  }

  .project-info { flex: 1; min-width: 0; }

  .project-name {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .project-desc {
    font-size: 13.5px;
    opacity: 0.8;
    margin-top: 3px;
    line-height: 1.4;
  }

  .tags {
    margin-top: 8px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .tag {
    font-size: 11px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: 999px;
    background: rgba(0,0,0,0.08);
  }

  .badge-live {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    font-weight: 700;
    color: #16a34a;
    background: rgba(22,163,74,0.12);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .badge-live::before {
    content: '';
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #16a34a;
  }

  .arrow {
    flex-shrink: 0;
    opacity: 0.5;
  }

  .empty-state {
    color: rgba(255,255,255,0.9);
    text-align: center;
    padding: 60px 20px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    backdrop-filter: blur(10px);
    font-size: 15px;
    line-height: 1.6;
  }

  @media (max-width: 480px) {
    .project-thumb { width: 52px; height: 52px; }
    .project-name { font-size: 15.5px; }
  }
</style>
</head>
<body>

  <div class="wrap">
    <a class="back" href="index.html">&larr; Về trang chính</a>

    <div class="header">
      <h1>Dự án của tôi</h1>
      <p>Những sản phẩm mình đã code và deploy lên Vercel</p>
    </div>

    <div class="project-list" id="projectList"></div>
  </div>

  <script>
    /* ============================================================
       THÊM DỰ ÁN Ở ĐÂY
       - name        : tên dự án
       - url         : link Vercel (hoặc domain riêng đã trỏ tới Vercel)
       - description : mô tả ngắn dự án làm gì
       - tags        : công nghệ dùng (mảng string, có thể để trống [])
       - thumb       : (tuỳ chọn) ảnh/logo dự án, để trong assets/projects/
       - live        : true nếu dự án đang chạy, false nếu đã ngưng
    ============================================================ */
    const projects = [
      // {
      //   name: "Portfolio Site",
      //   url: "https://portfolio-craftzdog.vercel.app",
      //   description: "Trang giới thiệu bản thân, blog cá nhân dựng bằng Next.js",
      //   tags: ["Next.js", "Tailwind"],
      //   thumb: "assets/projects/portfolio.png",
      //   live: true
      // },
      {
        name: "Todo App",
        url: "https://react-01-kohl.vercel.app/",
        description: "LandingPage Shoppy",
        // tags: ["React", "TypeScript"],
        // thumb: "assets/projects/todo.png",
        live: true
      },
    ];

    const projectList = document.getElementById('projectList');

    function initials(name) {
      return name
        .split(' ')
        .map(w => w[0])
        .join('')
        .slice(0, 2)
        .toUpperCase();
    }

    if (projects.length === 0) {
      projectList.innerHTML = `
        <div class="empty-state">
          Chưa có dự án nào.<br>
          Thêm dự án vào mảng <code>projects</code> trong file này để hiển thị ở đây.
        </div>`;
    } else {
      projects.forEach((p) => {
        const card = document.createElement('a');
        card.className = 'project-card';
        card.href = p.url;
        card.target = '_blank';
        card.rel = 'noopener';

        const thumbHtml = p.thumb
          ? `<img class="project-thumb" src="${p.thumb}" alt="${p.name}">`
          : `<div class="project-thumb" style="display:flex;align-items:center;justify-content:center;font-weight:700;color:rgba(0,0,0,0.5);">${initials(p.name)}</div>`;

        const tagsHtml = (p.tags && p.tags.length)
          ? `<div class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`
          : '';

        card.innerHTML = `
          ${thumbHtml}
          <div class="project-info">
            <div class="project-name">
              ${p.name}
              ${p.live !== false ? '<span class="badge-live">Live</span>' : ''}
            </div>
            <div class="project-desc">${p.description || ''}</div>
            ${tagsHtml}
          </div>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        `;
        projectList.appendChild(card);
      });
    }
  </script>

</body>
</html>
